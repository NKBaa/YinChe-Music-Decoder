name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only the runtime dependencies the decoder tests import.
      # PySide6 / frida / pyinstaller are needed to build the EXE, not to run tests.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycryptodomex==3.23.0 mutagen==1.48.1

      - name: Run decoder tests
        run: python -m unittest discover -s tests -v

  checksum:
    name: SHA-256 for release asset
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The EXE is attached to the release by build.ps1. Once it is there,
      # this step computes its checksum and publishes it as a release asset,
      # so the value quoted in the release notes can be verified independently.
      - name: Compute and publish SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Path . -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No .exe in the checkout, nothing to checksum. Upload it with build.ps1, then re-run this job."
            exit 0
          }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          $line = "$hash  $($exe.Name)"
          Set-Content -LiteralPath "SHA256SUMS.txt" -Value $line -Encoding utf8
          Write-Host "SHA-256 of $($exe.Name): $hash"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag SHA256SUMS.txt --clobber
          } else {
            Write-Host "Release $tag does not exist yet; checksum written to the job log only."
          }
